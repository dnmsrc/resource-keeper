appId: com.resourcekeeper.app
productName: ResourceKeeper
copyright: MIT

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/**/*
  - '!**/*.map'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 资源管家

mac:
  target: [dmg]
  category: public.app-category.productivity

linux:
  target: [AppImage]
  category: Utility